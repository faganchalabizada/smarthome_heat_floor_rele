blueprint:
  name: Thermostat temperature comparison → Relay (final stable)
  description: Controls relay based on thermostat temperature and hvac mode
  domain: automation

  input:
    thermostat:
      name: Thermostat
      selector:
        entity:
          domain: climate

    relay:
      name: Relay switch
      selector:
        entity:
          domain: switch

    hysteresis:
      name: Hysteresis
      default: 0.3
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: "°C"

trigger:
  - platform: state
    entity_id: !input thermostat

  - platform: time_pattern
    minutes: "/2"

variables:
  thermostat_entity: !input thermostat
  relay_entity: !input relay
  hyst: !input hysteresis
  hvac_mode: "{{ states(thermostat_entity) }}"
  current_temp: "{{ state_attr(thermostat_entity, 'current_temperature') | float(0) }}"
  target_temp: "{{ state_attr(thermostat_entity, 'temperature') | float(0) }}"

action:
  - choose:

      # 🔴 Если термостат выключен — выключаем реле всегда
      - conditions:
          - condition: template
            value_template: "{{ hvac_mode == 'off' }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ relay_entity }}"

      # 🟢 Если режим heat и нужно греть
      - conditions:
          - condition: template
            value_template: >
              {{ hvac_mode == 'heat' and
                 current_temp < (target_temp - hyst) }}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ relay_entity }}"

      # 🟡 Если достигли температуры — выключаем
      - conditions:
          - condition: template
            value_template: >
              {{ hvac_mode == 'heat' and
                 current_temp >= target_temp }}
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ relay_entity }}"

mode: restart
