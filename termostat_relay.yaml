blueprint:
  name: Thermostat temperature comparison → Relay (fixed)
  description: Turns relay on when current temperature is below target temperature.
  domain: automation
  input:
    thermostat:
      name: Thermostat
      selector:
        entity:
          domain: climate
    relay:
      name: Relay switch
      selector:
        entity:
          domain: switch
    hysteresis:
      name: Hysteresis
      default: 0.3
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: "°C"

trigger:
  - platform: state
    entity_id: !input thermostat
    attribute: current_temperature
  - platform: state
    entity_id: !input thermostat
    attribute: temperature

variables:
  thermostat_entity: !input thermostat
  relay_entity: !input relay
  hyst: !input hysteresis
  current_temp: "{{ state_attr(thermostat_entity, 'current_temperature') | float(0) }}"
  target_temp: "{{ state_attr(thermostat_entity, 'temperature') | float(0) }}"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ current_temp < (target_temp - hyst) }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ relay_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ current_temp >= target_temp }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ relay_entity }}"

mode: restart
